<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f6;--fg:#151a26;--dim:#cbd3e2;--mut:#5b667d;--panel:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--fg:#e9edf5;--dim:#2c3550;--mut:#8a94aa;--panel:#171e2e}}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next",-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}

.bpm{display:flex;align-items:center;gap:6px}
.bpm output{min-width:64px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:center}
.cell{background:var(--panel);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}

.sl{display:flex;gap:16px;align-items:center}.sl #bs{flex:2;width:auto}.sp{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}.sp input{flex:1;min-width:0;width:auto}
.key{display:flex;gap:8px}.key button{flex:1;font-size:13px;white-space:nowrap;min-width:0;padding:0 6px}[hidden]{display:none!important}.harm{display:flex;gap:10px;height:104px}#kbd,#wheel{aspect-ratio:auto;height:100%}#kbd{flex:1 1 auto;min-width:0;width:auto;max-width:none}#wheel{flex:0 0 auto;height:100%;width:auto;aspect-ratio:1}.key #rec.on{border-color:#e0307f;color:#e0307f;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.key #rec.on{animation:none}}
.ctl .d{flex:0 0 52px}.rr{display:flex;justify-content:space-between}.rr button{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;font-size:13px}.rr button.on{background:var(--c);border-color:var(--c);color:#0f1420}

  grid-template-columns:minmax(0,1fr) 260px;grid-template-areas:"grid panel" "harm panel";grid-template-rows:minmax(0,1fr) auto;gap:12px 18px}

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <aside class="panel">
  <header>
    <h1>Circles dk<small>S33</small></h1>
    <div class="bpm">
      <button id="m" aria-label="Diminuisci BPM">−</button>
      <output id="bv" aria-live="polite">90<span>BPM</span></output>
      <button id="p" aria-label="Aumenta BPM">+</button>
    </div>
  </header>
  <div class="sl"><input type="range" id="bs" min="40" max="200" value="90" aria-label="BPM"><label class="sp">Spazio<input type="range" id="sp" min="0" max="100" value="65" aria-label="Spazio interno: riverbero e delay"></label></div>
  <div class="key"><button id="kb">Tonalità La</button><button id="mb" aria-label="Modo">Minore</button><button id="lk" aria-label="Palline libere o agganciate al tempo">Libere</button></div>
  <div class="key"><button id="st" aria-label="Ferma tutto">■ Stop</button><button id="rec" disabled>● MIDI REC</button><button id="ev" aria-label="Evoluzione armonica">Evol. ○</button><button id="midb" aria-label="Ingresso MIDI">MIDI ○</button><button id="retb" aria-label="Rientro automatico della melodia">↩ 6s</button></div>
  </aside>

  <main class="grid" id="grid"></main>
</div>
<button id="fxb" aria-label="Effetti sullo sfondo" title="Effetti sullo sfondo: spenti, cerchi, onde, entrambi">✦</button>
<script>
const COL=['#e0307f','#e8a10f','#14aebf','#5fb52c'];
const R=[.25,.5,1,2],RL=['¼','½','1','2'];
const NOTE=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const SC={lid:[0,2,4,6,7,9,11],maj:[0,2,4,5,7,9,11],mis:[0,2,4,5,7,9,10],dor:[0,2,3,5,7,9,10],min:[0,2,3,5,7,8,10],fri:[0,1,3,5,7,8,10]};
const MD=[{k:'lid',n:'Lidio'},{k:'maj',n:'Maggiore'},{k:'mis',n:'Misolidio'},{k:'dor',n:'Dorico'},{k:'min',n:'Minore'},{k:'fri',n:'Frigio'}];
const NEXT={
 lid:[0,1,1,4,5,2],
 maj:[0,3,4,5,1],
 mis:[0,6,6,3,4,1],
 dor:[0,3,3,6,2],
 min:[0,5,2,6,3],
 fri:[0,1,1,6,2,5]
};
const DENS=[0,.3,.55,.85],DL=['○','•','••','•••'],DN=['spenta','rada','media','fitta'];
const PRE=[
 {name:'Pulso',l:[{s:0,k:4,n:16,r:0},{s:2,k:4,n:16,r:2}]},
 {name:'Respiro',l:[{s:0,k:2,n:16,r:0},{s:3,k:3,n:7,r:0},{s:2,k:3,n:16,r:5}]},
 {name:'Tresillo',l:[{s:0,k:3,n:8,r:0},{s:1,k:2,n:8,r:2},{s:2,k:5,n:8,r:1}]},
 {name:'Clave',l:[{s:0,k:3,n:8,r:0},{s:1,k:5,n:16,r:0},{s:3,k:4,n:16,r:1}]},
 {name:'Poli',l:[{s:0,k:4,n:16,r:0},{s:1,k:3,n:10,r:0},{s:3,k:5,n:12,r:0},{s:2,k:7,n:9,r:0}]},
 {name:'Sparso',l:[{s:0,k:1,n:16,r:0},{s:2,k:2,n:16,r:6},{s:3,k:2,n:12,r:3}]},
 {name:'Cuore',l:[{s:0,k:1,n:16,r:0},{s:0,k:1,n:16,r:13},{s:2,k:3,n:16,r:5}]},
 {name:'Bossa',l:[{s:0,k:3,n:8,r:0},{s:1,k:5,n:16,r:2},{s:2,k:8,n:16,r:0}]},
 {name:'Four',l:[{s:0,k:4,n:16,r:0},{s:2,k:8,n:16,r:1},{s:3,k:3,n:16,r:6}]},
 {name:'Dub',l:[{s:0,k:2,n:8,r:0},{s:1,k:1,n:8,r:4},{s:2,k:3,n:8,r:1}]},
 {name:'Shuffle',l:[{s:0,k:4,n:12,r:0},{s:1,k:3,n:12,r:2},{s:2,k:8,n:12,r:1}]},
 {name:'Bembé',l:[{s:3,k:7,n:12,r:0},{s:0,k:3,n:12,r:0},{s:1,k:5,n:12,r:2}]},
 {name:'Sette',l:[{s:0,k:3,n:7,r:0},{s:1,k:2,n:7,r:3},{s:2,k:5,n:7,r:1}]},
 {name:'Nebbia',l:[{s:0,k:2,n:13,r:0},{s:3,k:3,n:11,r:0},{s:1,k:2,n:7,r:3},{s:2,k:5,n:17,r:0}]}
];
const eu=(s,L)=>(((s+L.r)%L.n)*L.k)%L.n<L.k;
const TIMB=[null,['Sub','Morbido','FM','Pulse','Legno','Growl','Cavo'],['Campana','Kalimba','Piano','Flauto','Tondo'],['Caldo','Vitreo','Drone','Archi','Aria','Organo','FM lento','Luce','Profondo']];
const ARP=[[0,2,4,7,4,2],[0,2,4,2,7,4],[0,4,2,7,2,4],[4,2,0,2,4,7]];
const FILLS=[
 [[[7,45]],[[7,52]],[[7,60]],[[7,68]],[[7,78]],[[7,88]],[[7,100]],[[7,112]]],
 [[[4,100]],[[4,85]],[[5,100]],[[5,85]],[[6,100]],[[6,85]],[[6,110],[0,100]],[[0,115]]],
 [[[0,105]],[],[[7,90]],[],[[7,85]],[[7,100]],[[4,100]],[[6,112],[0,100]]],
 [[[2,60]],[[2,70]],[[2,80],[1,70]],[[2,90]],[[3,95]],[[3,100]],[[5,100]],[[6,112]]]
];
const BP=[{name:'Lungo'},{name:'Impulso',l:{k:3,n:8,r:0}},{name:'Sincope',l:{k:5,n:16,r:2}},{name:'Ostinato',l:{k:5,n:8,r:0}},{name:'Kick'}];
const C=[
 {role:'',pre:1,div:4,ratio:1},
 {role:'Basso',dl:2,bp:0,bi:0,tm:0,ratio:.5},
 {role:'Melodia',dl:1,pos:2,tm:2,ratio:2},
 {role:'Pad',dl:2,tm:0,ratio:.25}
];
let bpm=90,pc=9,mode='min',ac,dry,send,dly,noise,t0=0,chords=[0],curBus,live=[],space=.65,keys=[9],tgt=null,pend=null,evo=0,kp=9;
const per=c=>60/(bpm*c.ratio)/(c.bp?4:(c.div||1));
const anyOn=()=>C.some(c=>c.on);
const fmt=r=>r<1?'×1/'+Math.round(1/r):'×'+r;

/* ---------- armonia ---------- */
const f5=p=>(p*7)%12;
function stepToward(a,b){const fa=f5(a),d=(f5(b)-fa+12)%12;return f5((d<=6?fa+1:fa+11)%12);}
function bar(n){
  while(chords.length<=n){
    const m=chords.length,pk=keys[m-1],cur=chords[m-1];let k=pk;
    if(tgt!==null&&tgt!==pk)k=stepToward(pk,tgt);
    else if(evo&&Math.random()<[0,.08,.2][evo]){
      const h=(f5(pc)-f5(pk)+12)%12,tow=pk!==pc&&Math.random()<.45?(h<=6?1:-1):(Math.random()<.5?1:-1);
      k=f5((f5(pk)+tow+12)%12);
    }
    keys.push(k);
    if(pend!==null){chords.push(pend);pend=null;}
    else if(k!==pk)chords.push(0);
    else{const l=NEXT[mode].filter(x=>x!==cur);chords.push(cur!==0&&Math.random()<.4?0:l[Math.random()*l.length|0]);}
  }
}
function chordAt(t){
  if(!anyOn()){kp=pc;return 0;}
  const n=Math.max(0,Math.floor((t-t0)/(16*60/bpm)));
  bar(n);kp=keys[n];
  if(hold){if(t<=hold.until){chords[n]=hold.deg;return hold.deg;}hold=null;}
  return chords[n];
}
function harmNow(now){
  if(ac&&anyOn()){const n=Math.max(0,Math.floor((now-t0)/(16*60/bpm)));bar(n);return{k:keys[n],ch:(hold&&now<=hold.until)?hold.deg:chords[n]};}
  return{k:pc,ch:0};
}
function fq(idx,base){
  return 440*Math.pow(2,(base+kp+Math.floor(idx/7)*12+SC[mode][((idx%7)+7)%7]-69)/12);
}
function walk(c,lo,hi,ch){
  const s=Math.random()<.12?[-4,-3,3,4][Math.random()*4|0]:[-2,-1,-1,0,1,1,2][Math.random()*7|0];
  let p=Math.max(lo,Math.min(hi,c.pos+s));
  if(Math.random()<.6){
    const ct=[ch,ch+2,ch+4].map(x=>x%7);
    for(const q of [p,p+1,p-1]){if(ct.includes(((q%7)+7)%7)){p=q;break;}}
  }
  return c.pos=Math.max(lo,Math.min(hi,p));
}

/* ---------- audio ---------- */
function init(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);
    dry=ac.createGain();dry.gain.value=.8;dry.connect(comp);
    send=ac.createGain();send.gain.value=space*space*2.4;
    const cv=ac.createConvolver(),n=ac.sampleRate*5|0,ir=ac.createBuffer(2,n,ac.sampleRate);
    for(let h=0;h<2;h++){const d=ir.getChannelData(h);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);}
    cv.buffer=ir;const rg=ac.createGain();rg.gain.value=.7;send.connect(cv);cv.connect(rg);rg.connect(comp);
    dly=ac.createDelay(2);const fb=ac.createGain(),lp=ac.createBiquadFilter(),dg=ac.createGain();
    dly.delayTime.value=60/bpm*.75;fb.gain.value=.4;lp.type='lowpass';lp.frequency.value=2200;dg.gain.value=.5;
    send.connect(dly);dly.connect(lp);lp.connect(fb);fb.connect(dly);lp.connect(dg);dg.connect(comp);
    noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    C.forEach(c=>{
      c.bus={d:ac.createGain(),w:ac.createGain(),fd:ac.createBiquadFilter(),fw:ac.createBiquadFilter(),cs:ac.createConstantSource()};
      [c.bus.fd,c.bus.fw].forEach(fl=>{fl.type='lowpass';fl.Q.value=.9;});
      c.bus.d.connect(c.bus.fd);c.bus.fd.connect(dry);c.bus.w.connect(c.bus.fw);c.bus.fw.connect(send);
      c.bus.cs.start();setVol(c,c.vol);setFlt(c,c.fv);
    });
    setInterval(sched,25);
  }
  if(ac.state==='suspended')ac.resume();
}
function env(g,t,a,d,pk){g.gain.setValueAtTime(.0001,t);if(a>.5)g.gain.linearRampToValueAtTime(pk,t+a);else g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function osc(type,f,t,dur){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;}
function gain(w){
  const g=ac.createGain();g.connect(curBus.d);
  const s=ac.createGain();s.gain.value=w===undefined?.06:w;g.connect(s);s.connect(curBus.w);return g;
}
function hit(t,d,f,type,pk){
  const s=ac.createBufferSource();s.buffer=noise;
  const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;
  const g=gain();env(g,t,.001,d,pk);
  s.connect(fl);fl.connect(g);s.start(t,Math.random()*.5,d+.05);
}
function note(f,t,type,a,d,pk,wet,lp){
  const o=osc(type,f,t,a+d+.1),fl=ac.createBiquadFilter(),k=ac.createGain(),g=gain(wet);
  fl.type='lowpass';fl.frequency.value=lp;env(g,t,a,d,pk);o.connect(fl);fl.connect(k);k.connect(g);
  live.push({o,k,t});o.onended=()=>{const j=live.findIndex(v=>v.o===o);if(j>=0)live.splice(j,1);};
}
function trk(o,k,t){live.push({o,k,t});o.onended=()=>{const j=live.findIndex(v=>v.o===o);if(j>=0)live.splice(j,1);};}
function bus(t,a,d,pk,wet){const k=ac.createGain(),g=gain(wet);env(g,t,a,d,pk);k.connect(g);return k;}
function fmv(f,mr,ix,md,t,a,d,pk,wet,lp){
  const dur=a+d+.1,k=bus(t,a,d,pk,wet),fl=ac.createBiquadFilter(),c=osc('sine',f,t,dur),m=osc('sine',f*mr,t,dur),mg=ac.createGain();
  fl.type='lowpass';fl.frequency.value=lp;
  mg.gain.setValueAtTime(f*ix,t);mg.gain.exponentialRampToValueAtTime(f*ix*.04,t+md);
  m.connect(mg);mg.connect(c.frequency);c.connect(fl);fl.connect(k);trk(c,k,t);trk(m,k,t);
}
function choir(f,t,a,d,pk,wet,vw){
  const dur=a+d+.1,k=bus(t,a,d,pk,wet),os=[osc('sawtooth',f*.996,t,dur),osc('sawtooth',f*1.004,t,dur)],lf=osc('sine',4.8,t,dur),lg=ac.createGain();
  lg.gain.value=f*.007;lf.connect(lg);
  os.forEach(o=>{
    lg.connect(o.frequency);
    vw.forEach(([fr,q,gn])=>{const b=ac.createBiquadFilter(),gg=ac.createGain();b.type='bandpass';b.frequency.value=fr;b.Q.value=q;gg.gain.value=gn;o.connect(b);b.connect(gg);gg.connect(k);});
    trk(o,k,t);
  });
  trk(lf,k,t);
}
var rec=null;
const mn=f=>Math.max(0,Math.min(127,Math.round(69+12*Math.log2(f/440))));
function recN(i,t,n,d,v){
  if(fx)fxEv(i,t,n,v,d);
  if(!rec||t<rec.t0||t>rec.stop)return;
  rec.ev[i].push({t,n,d,v:Math.max(1,Math.min(127,Math.round(v)))});
}
function toBeats(tp,t){
  let b=0;
  for(let i=0;i<tp.length;i++){
    const a=tp[i].t,e=i+1<tp.length?tp[i+1].t:Infinity;
    if(t<=a)break;
    b+=(Math.min(t,e)-a)*tp[i].bpm/60;
  }
  return b;
}
const vlq=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b;};
function midiFile(name,ch,notes,tp){
  const PPQ=480,ev=[],tk=t=>Math.round(toBeats(tp,t)*PPQ);
  tp.forEach(x=>{const m=Math.round(60000000/x.bpm);ev.push({k:tk(x.t),o:0,b:[0xFF,0x51,3,m>>16&255,m>>8&255,m&255]});});
  notes.forEach(x=>{
    const on=tk(x.t),off=Math.max(on+1,tk(x.t+x.d));
    ev.push({k:on,o:2,b:[0x90|ch,x.n,x.v]});ev.push({k:off,o:1,b:[0x80|ch,x.n,0]});
  });
  ev.sort((a,b)=>a.k-b.k||a.o-b.o);
  const nb=[...name].map(c=>c.charCodeAt(0)&127);
  const body=[0,0xFF,0x03,nb.length,...nb,0,0xFF,0x58,4,4,2,24,8];
  let last=0;
  ev.forEach(e=>{body.push(...vlq(e.k-last),...e.b);last=e.k;});
  body.push(0,0xFF,0x2F,0);
  const L=body.length;
  return new Uint8Array([0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,PPQ>>8,PPQ&255,0x4D,0x54,0x72,0x6B,L>>>24&255,L>>16&255,L>>8&255,L&255,...body]);
}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

}
const midb=document.getElementById('midb'),retb=document.getElementById('retb');
midb.onclick=()=>{if(!mAcc){triedMidi=true;midiInit();}else if(manual){manual=false;lastRel=0;}};
retb.onclick=()=>{const L=[3,6,12,0];retDelay=L[(L.indexOf(retDelay)+1)%4];retb.textContent='↩ '+(retDelay?retDelay+'s':'mai');};
document.addEventListener('pointerdown',()=>{if(!mAcc&&!triedMidi){triedMidi=true;midiInit();}},{once:true});
try{navigator.permissions&&navigator.permissions.query({name:'midi'}).then(p=>{if(p.state==='granted'&&!triedMidi){triedMidi=true;midiInit();}}).catch(()=>{});}catch(e){}

/* ---------- disegno ---------- */
function frame(){
  const cs=getComputedStyle(document.documentElement),dim=cs.getPropertyValue('--dim').trim(),mut=cs.getPropertyValue('--mut').trim();
  const now=ac?ac.currentTime:0,d=window.devicePixelRatio||1;
  const pn=performance.now(),dt=Math.min(.05,(pn-(lastF||pn))/1000);lastF=pn;
  C.forEach((c,i)=>{
    if(!i||!c.on||!ac)return;
    c.balls.forEach(b=>{
      if(b.g)return;
      if(lock){stepLock(i,c,b,now);return;}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      const rr=Math.hypot(b.x,b.y);
      if(rr>=1){
        const nx=b.x/rr,ny=b.y/rr,dp=b.vx*nx+b.vy*ny;
        if(dp>0){b.vx-=2*dp*nx;b.vy-=2*dp*ny;}
        b.x=nx*.995;b.y=ny*.995;
        ballHit(i,Math.atan2(ny,nx));
      }
    });
  });
  C.forEach((c,i)=>{
    const cn=c.cv,w=cn.clientWidth;if(!w)return;
    if(cn.width!==Math.round(w*d))cn.width=cn.height=Math.round(w*d);
    const x=cn.getContext('2d'),m=w/2,r=w*.29,col=COL[i];
    x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,w);
    let inten=0,u=1,sA=1;
    if(c.on&&ac&&(i===0||(i===1&&c.bp))){if(c.ls!==undefined&&now>=c.ls){u=Math.min(1,(now-c.ls)/.45);inten=(1-u)*(1-u);}}
    else if(c.on&&ac){const p=per(c),ph=(now-t0)/p;if(ph>=0){u=Math.min(1,((ph%1)*p)/.55);const tb=t0+Math.floor(ph)*p,s=(i===0||Math.abs((c.ls||-9)-tb)<.002)?1:.25;inten=(1-u)*(1-u)*s;sA=s;}}
    x.beginPath();x.arc(m,m,r,0,7);
    if(c.on){x.globalAlpha=.1+.4*inten;x.fillStyle=col;x.fill();x.globalAlpha=1;}
    x.lineWidth=c.on?3+9*inten:2.5;x.strokeStyle=c.on?col:dim;x.stroke();
    if(c.on&&u<1){x.beginPath();x.arc(m,m,r+u*w*.17,0,7);x.globalAlpha=(1-u)*.8*sA;x.lineWidth=2;x.strokeStyle=col;x.stroke();x.globalAlpha=1;}
    if(!c.on&&i){x.fillStyle=mut;x.font='500 13px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('tocca',m,m);}
    if(i===0||(i===1&&c.bp)){const P=i===0?PRE[c.pre].l:c.bp===4?[PRE[C[0].pre].l.find(L=>L.s===0)].filter(Boolean):[BP[c.bp].l],
        st=c.on&&ac?Math.floor((now-t0)/(i===1&&c.bp===4?per(C[0]):per(c))):-1;
      P.forEach((L,li)=>{const rr=r*(.86-.17*li),cur=st>=0?st%L.n:-1;
        for(let j=0;j<L.n;j++){const a=-Math.PI/2+j/L.n*Math.PI*2,h=eu(j,L),e=j===cur;
          x.globalAlpha=h?(e?1:.85):(e?.8:.4);x.fillStyle=h?col:mut;
          x.beginPath();x.arc(m+rr*Math.cos(a),m+rr*Math.sin(a),(h?2.6:1.5)+(e?1.4:0),0,7);x.fill();}
      });x.globalAlpha=1;}
    if(i===0){const bx=w-24,by=w-24,fa=!!c.fl,fq=!!c.fq;
      x.lineWidth=3;x.strokeStyle=dim;x.beginPath();x.arc(bx,by,12,0,7);x.stroke();
      if(fa||fq){x.globalAlpha=fa?1:.5+.5*Math.sin(pn/120);x.fillStyle='#e8a10f';x.beginPath();x.arc(bx,by,12,0,7);x.fill();x.globalAlpha=1;}
      x.fillStyle=fa||fq?'#0f1420':col;x.globalAlpha=c.on?1:.7;x.font='700 9px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('fill',bx,by+.5);x.globalAlpha=1;}
    if(i){
      (c.hf=(c.hf||[]).filter(h=>pn-h.t<450)).forEach(h=>{const u=(pn-h.t)/450;if(u<0)return;x.globalAlpha=(1-u)*.9;x.strokeStyle=col;x.lineWidth=7*(1-u)+2;x.beginPath();x.arc(m,m,r,h.a-.3,h.a+.3);x.stroke();});
      c.balls.forEach(b=>{
        const bx=m+b.x*r,by=m+b.y*r;
        x.fillStyle=col;x.globalAlpha=c.on?.25:.12;x.beginPath();x.arc(bx,by,10,0,7);x.fill();
        x.globalAlpha=c.on?1:.55;x.beginPath();x.arc(bx,by,b.g?8:5.5,0,7);x.fill();
      });
      {const bx=w-24,by=w-24,n=c.nb;x.globalAlpha=1;x.lineWidth=3;x.strokeStyle=dim;x.beginPath();x.arc(bx,by,10,0,7);x.stroke();
       x.fillStyle=col;x.globalAlpha=c.on?.95:.55;
       if(n){for(let j=0;j<n;j++){x.beginPath();x.arc(bx+(j-(n-1)/2)*6,by,2.3,0,7);x.fill();}}
       else{x.strokeStyle=mut;x.lineWidth=1.6;x.beginPath();x.moveTo(bx-4,by);x.lineTo(bx+4,by);x.moveTo(bx,by-4);x.lineTo(bx,by+4);x.stroke();}
       x.globalAlpha=1;}
    }
    if(i===2&&manual){x.fillStyle=col;x.globalAlpha=.9;x.font='700 11px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('MIDI',m,m);x.globalAlpha=1;}
    if(i){const T=TIMB[i],n=T.length,kx=24,ky=24,kr=10;x.lineWidth=3;
      for(let j=0;j<n;j++){const a0=-Math.PI/2+j/n*Math.PI*2+.18,a1=-Math.PI/2+(j+1)/n*Math.PI*2-.18;
        x.strokeStyle=j===c.tm?col:dim;x.globalAlpha=j===c.tm?(c.on?1:.6):1;x.beginPath();x.arc(kx,ky,kr,a0,a1);x.stroke();}
      x.globalAlpha=1;
      const ag=performance.now()-(c.tms||-9e9);
      if(ag<1600){x.globalAlpha=Math.min(1,(1600-ag)/500);x.fillStyle=mut;x.font='500 12px system-ui,sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillText(T[c.tm],kx+kr+8,ky);x.globalAlpha=1;}}
    {const kx=24,ky=w-24,kr=10;x.lineWidth=3;x.strokeStyle=dim;x.beginPath();x.arc(kx,ky,kr,0,7);x.stroke();
     if(c.fv>.01){x.strokeStyle=col;x.globalAlpha=c.on?1:.6;x.beginPath();x.arc(kx,ky,kr,-Math.PI/2,-Math.PI/2+c.fv*Math.PI*2);x.stroke();}
     x.strokeStyle=col;x.globalAlpha=c.on?.9:.5;x.lineWidth=1.8;x.beginPath();x.moveTo(kx-4,ky+2);x.quadraticCurveTo(kx,ky-6,kx+4,ky+3);x.stroke();x.globalAlpha=1;
     const fa=performance.now()-(c.fms||-9e9);
     if(fa<1400){x.globalAlpha=Math.min(1,(1400-fa)/500);x.fillStyle=mut;x.font='500 12px system-ui,sans-serif';x.textAlign='left';x.textBaseline='middle';
       const fr=150*Math.pow(2,c.fv*7);x.fillText('Filtro '+(fr>=1000?(fr/1000).toFixed(1)+' kHz':Math.round(fr)+' Hz'),kx+kr+8,ky);x.globalAlpha=1;}}
    {const kx=w-24,ky=24,kr=10;x.lineWidth=3;x.strokeStyle=dim;x.beginPath();x.arc(kx,ky,kr,0,7);x.stroke();
     if(c.vol>.01){x.strokeStyle=col;x.globalAlpha=c.on?1:.6;x.beginPath();x.arc(kx,ky,kr,-Math.PI/2,-Math.PI/2+c.vol*Math.PI*2);x.stroke();}
     x.fillStyle=col;x.globalAlpha=c.on?.9:.5;x.beginPath();x.arc(kx,ky,3,0,7);x.fill();x.globalAlpha=1;}
  });
  midiTick();
  drawFx(now);
  drawHarm(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
